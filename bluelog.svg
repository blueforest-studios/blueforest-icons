<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BlueLog icon: a logbook whose newest entry is blue — black-outline family style -->
  <!-- book -->
  <rect x="112" y="56" width="300" height="400" rx="28"
        fill="#FFFFFF" stroke="#000000" stroke-width="28" stroke-linejoin="round"/>
  <!-- binding rings -->
  <line x1="84" y1="132" x2="148" y2="132" stroke="#000000" stroke-width="28" stroke-linecap="round"/>
  <line x1="84" y1="256" x2="148" y2="256" stroke="#000000" stroke-width="28" stroke-linecap="round"/>
  <line x1="84" y1="380" x2="148" y2="380" stroke="#000000" stroke-width="28" stroke-linecap="round"/>
  <!-- logged entries -->
  <line x1="196" y1="150" x2="340" y2="150" stroke="#000000" stroke-width="26" stroke-linecap="round"/>
  <line x1="196" y1="222" x2="340" y2="222" stroke="#000000" stroke-width="26" stroke-linecap="round"/>
  <line x1="196" y1="294" x2="300" y2="294" stroke="#000000" stroke-width="26" stroke-linecap="round"/>
  <!-- newest entry, in blue -->
  <line x1="196" y1="366" x2="340" y2="366" stroke="#009FE0" stroke-width="34" stroke-linecap="round"/>
</svg>
